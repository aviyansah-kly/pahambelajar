name: Audit Math Runtime Banks

on:
  workflow_dispatch:
  push:
    branches:
      - feat/chapter-based-two-subjects
    paths:
      - 'math-bank-runtime.js'
      - 'math-bank-runtime-v2.js'
      - 'math-bank-runtime-v3.js'
      - 'math-bank-quality-v3.js'
      - 'scripts/audit-runtime-math-banks.mjs'
      - 'public/data/core-curriculum-v2.json'
      - '.github/workflows/build-math-banks.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/chapter-based-two-subjects
      - name: Audit active runtime banks
        run: node scripts/audit-runtime-math-banks.mjs
