name: Build Math Banks

on:
  workflow_dispatch:
  push:
    branches:
      - feat/chapter-based-two-subjects
    paths:
      - 'scripts/build-math-banks.mjs'
      - 'public/data/core-curriculum-v2.json'

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/chapter-based-two-subjects
      - name: Build deterministic banks
        run: node scripts/build-math-banks.mjs
      - name: Validate bank structure
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          let failed=false;
          for (const grade of [1,2,3]) {
            const file=`public/data/question-bank-math-g${grade}-v2.json`;
            const data=JSON.parse(fs.readFileSync(file,'utf8'));
            for (const [title,ch] of Object.entries(data.chapters||{})) {
              for (const skill of ch.skills||[]) {
                const rows=(ch.practice||[]).filter(q=>q.skill===skill);
                if (rows.length!==8) { console.error(`${file} ${title} ${skill}: ${rows.length} questions`); failed=true; }
              }
              for (const item of ch.practice||[]) {
                if (item.type!=='choice'||item.o?.length!==4||new Set(item.o).size!==4||item.a<0||item.a>3||!item.why) {
                  console.error(`${file} invalid question ${item.id}`); failed=true;
                }
              }
            }
          }
          if (failed) process.exit(1);
          console.log('All Grade 1-3 banks have 8 unique choice questions per skill.');
          NODE
      - name: Commit generated banks
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/question-bank-math-g1-v2.json public/data/question-bank-math-g2-v2.json public/data/question-bank-math-g3-v2.json
          if git diff --cached --quiet; then
            echo 'No generated bank changes.'
          else
            git commit -m 'build: generate Math question banks Grades 1-3'
            git push origin HEAD:feat/chapter-based-two-subjects
          fi
