name: Audit Runtime Learning Banks

on:
  workflow_dispatch:
  push:
    branches:
      - feat/chapter-based-two-subjects
    paths:
      - 'math-bank-runtime.js'
      - 'math-bank-runtime-v2.js'
      - 'math-bank-runtime-v3.js'
      - 'math-bank-quality-v3.js'
      - 'english-bank-runtime.js'
      - 'english-bank-runtime-v2.js'
      - 'quality-router.js'
      - 'app-router.js'
      - 'scripts/audit-runtime-math-banks.mjs'
      - 'scripts/audit-runtime-english-banks.mjs'
      - 'scripts/verify-preview-editorial.mjs'
      - 'public/data/core-curriculum-v2.json'
      - '.github/workflows/build-math-banks.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/chapter-based-two-subjects
      - name: Audit Math runtime banks
        run: node scripts/audit-runtime-math-banks.mjs
      - name: Audit English runtime banks
        run: node scripts/audit-runtime-english-banks.mjs
      - name: Verify Cloudflare preview and run editorial sweep
        env:
          PAHAM_PREVIEW: https://feat-chapter-based-two-subjects-paham-belajar.avi-yansah.workers.dev
        run: node scripts/verify-preview-editorial.mjs
