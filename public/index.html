<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5965d8">
<title>PahamBelajar — Belajar per Bab</title>
<style>
*{box-sizing:border-box}:root{--bg:#f6f7fb;--ink:#1d2433;--muted:#667085;--line:#e5e7eb;--primary:#5965d8}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{position:sticky;top:0;z-index:50;background:#fffffff2;border-bottom:1px solid var(--line)}.topin{max-width:1080px;margin:auto;padding:14px 16px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;font-size:18px}.brand span{color:var(--primary)}.small{font-size:13px;color:var(--muted)}.app{max-width:1080px;margin:auto;padding:0 16px 56px}.hero{margin:24px 0 18px;border-radius:28px;padding:28px;background:linear-gradient(135deg,#5360d9,#7c3aed);color:#fff}.hero .eyebrow{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;opacity:.86}.hero h1{font-size:clamp(30px,5vw,46px);line-height:1.08;margin:8px 0 10px}.hero p{margin:0;line-height:1.6;color:#ede9fe}.boot{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px;display:flex;gap:12px;align-items:flex-start}.boot-dot{width:11px;height:11px;border-radius:999px;background:#5965d8;margin-top:5px;flex:none}.boot h3{margin:0 0 4px;font-size:16px}.boot p{margin:0;color:var(--muted);line-height:1.5}.boot.error{border-color:#fecaca;background:#fff7f7}.boot.error .boot-dot{background:#dc2626}.boot.ok{border-color:#bbf7d0;background:#f0fdf4}.boot.ok .boot-dot{background:#16a34a}.version{margin-top:8px;font-size:12px;color:#98a2b3}#catalog{display:none}@media(max-width:700px){.hero{padding:22px 20px;margin-top:16px;border-radius:22px}.app{padding-left:14px;padding-right:14px}}
</style>
</head>
<body>
<header class="top"><div class="topin"><div class="brand">Paham<span>Belajar</span></div><div class="small">Belajar per bab</div></div></header>
<main class="app">
<section id="home">
  <div class="hero"><div class="eyebrow">Belajar lebih terarah</div><h1>Pahami materinya, latihan, lalu cek hasilnya.</h1><p>Materi disusun per kelas, mata pelajaran, dan bab agar anak bisa belajar sedikit demi sedikit.</p></div>
  <div id="bootStatus" class="boot"><span class="boot-dot"></span><div><h3>Menyiapkan aplikasi…</h3><p id="bootText">Memuat modul utama PahamBelajar.</p><div class="version">Build check: PB-20260827-01</div></div></div>
  <div id="catalog"></div>
</section>
</main>
<script>
(()=>{
 const VERSION='PB-20260827-01';
 const status=document.getElementById('bootStatus');
 const text=document.getElementById('bootText');
 function setState(kind,msg){status.className='boot '+kind;text.textContent=msg;}
 function load(src,timeout){return new Promise((resolve,reject)=>{const s=document.createElement('script');const timer=setTimeout(()=>{s.remove();reject(new Error('timeout'))},timeout);s.src=src+'?v='+encodeURIComponent(VERSION);s.async=true;s.onload=()=>{clearTimeout(timer);resolve()};s.onerror=()=>{clearTimeout(timer);reject(new Error('error'))};document.head.appendChild(s);});}
 async function boot(){
  try{
   await load('/pahambelajar-enhancements.js',5000);
   setState('ok','Modul utama berhasil dimuat. Menyiapkan profil dan kurikulum…');
   const extras=['/child-ux.js','/math-engine.js','/remedial-feedback.js'];
   for(const f of extras){try{await load(f,3500)}catch(e){console.warn('Optional module failed',f,e)}}
   setTimeout(()=>{if(document.querySelector('.pb-overlay')||document.getElementById('pbCurriculum'))status.style.display='none';},500);
  }catch(e){
   console.error('PahamBelajar boot failed',e);
   setState('error','Modul utama gagal dimuat dari server. Halaman HTML sudah aktif, tetapi aplikasi interaktif belum berjalan.');
  }
 }
 window.addEventListener('error',e=>console.error('Window error',e.error||e.message));
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
})();
</script>
</body>
</html>
