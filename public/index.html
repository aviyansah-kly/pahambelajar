{g:1,s:'Bahasa Inggris',i:'🇬🇧',id:'e1',c:'My Body and Senses',d:'Body parts, five senses, This/These, dan fungsi bagian tubuh.',learn:[['🧒','Body Parts','Kenali nama bagian tubuh.',['eyes=mata','ears=telinga','nose=hidung','hands=tangan'],'Point to your eyes.','Kenali kata dasar','“mata” = …',['Eyes','Ears','Hands'],0],['1️⃣','This','Gunakan this untuk satu benda.',['this eye','this nose','this mouth'],'This is my nose.','This = satu','___ is my nose.',['This','These','They'],0],['2️⃣','These','Gunakan these untuk lebih dari satu.',['these eyes','these ears','these hands'],'These are my hands.','These = lebih dari satu','___ are my hands.',['This','These','It'],1],['👀','Five Senses','Bagian tubuh membantu kita melihat, mendengar, mencium, mengecap, dan menyentuh.',['eyes→see','ears→hear','nose→smell','tongue→taste'],'I see with my eyes.','Eyes see. Ears hear.','I hear with my …',['eyes','ears','nose'],1]],p:[['Body part to see …',['Eyes','Ears','Nose'],0,'Body'],['___ is my nose.',['This','These','They'],0,'This/These'],['___ are my hands.',['This','These','It'],1,'This/These'],['Nose is used to …',['see','hear','smell'],2,'Senses'],['Ears are used to …',['hear','taste','see'],0,'Senses'],['I see with my …',['eyes','ears','nose'],0,'Senses']],q:[['These are my …',['eye','hands','nose'],1,'This/These'],['I use my eyes to …',['see','hear','taste'],0,'Senses'],['I use my tongue to …',['taste','hear','walk'],0,'Senses'],['I hear with my …',['nose','ears','eyes'],1,'Senses']]},

];
let grade=4,current=null,pa=[],qa=[],qi=0;
function show(id){['home','chapter'].forEach(x=>$(x).classList.toggle('active',x===id));scrollTo({top:0,behavior:'smooth'})}
function renderCatalog(){const items=DATA.filter(x=>x.g===grade),groups={};items.forEach(x=>{groups[x.s]??={s:x.s,i:x.i,items:[]};groups[x.s].items.push(x)});$('catalog').innerHTML=Object.values(groups).map(g=>`<div class="card"><div class="subject"><div class="icon">${g.i}</div><div style="flex:1"><h3>${g.s}</h3><div class="chapters">${g.items.map(x=>`<div class="chapter"><div><b>${x.c}</b><span class="small">${x.learn.length} rangkuman • ${x.p.length} latihan • ${x.q.length} tes</span></div><button class="btn soft open" data-id="${x.id}">Buka →</button></div>`).join('')}</div></div></div></div>`).join('');document.querySelectorAll('.open').forEach(b=>b.onclick=()=>openChapter(b.dataset.id))}
document.querySelectorAll('.grade').forEach(b=>b.onclick=()=>{grade=+b.dataset.g;document.querySelectorAll('.grade').forEach(x=>x.classList.toggle('on',x===b));renderCatalog()});
function openChapter(id){current=DATA.find(x=>x.id===id);pa=Array(current.p.length).fill(null);qa=Array(current.q.length).fill(null);qi=0;$('crumb').textContent=`Kelas ${current.g} • ${current.s} • ${current.c}`;$('eyebrow').textContent=`${current.s} • Kelas ${current.g}`;$('title').textContent=current.c;$('desc').textContent=current.d;renderLearn();renderPractice();renderQuiz();renderResultPlaceholder();activate('learn');show('chapter')}
function renderLearn(){$('learn').innerHTML=`<div class="card"><h2>Yuk, pahami sedikit demi sedikit</h2><p class="muted">Baca satu kartu, lihat contoh, lalu jawab pertanyaan cepat.</p><div class="kidcards">${current.learn.map((s,i)=>`<div class="kid"><div class="kidtop"><div class="emoji">${s[0]}</div><div><div class="small">Bagian ${i+1}</div><h3>${s[1]}</h3><div class="lead">${s[2]}</div></div></div><div class="points">${s[3].map(p=>`<div class="point">✓ ${p}</div>`).join('')}</div><div class="example"><b>Contoh:</b> ${s[4]}</div><div class="remember">💡 Ingat: ${s[5]}</div><div class="mini"><div class="q">${s[6]}</div><div class="miniopts">${s[7].map((o,j)=>`<button class="miniopt" data-i="${i}" data-o="${j}">${o}</button>`).join('')}</div><div id="mf${i}" class="small" style="margin-top:8px"></div></div></div>`).join('')}</div><div class="cta"><div><b>Sudah selesai membaca?</b><div class="small">Lanjut ke latihan.</div></div><button id="toPractice" class="btn dark">Mulai Latihan →</button></div></div>`;document.querySelectorAll('.miniopt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,o=+b.dataset.o,s=current.learn[i];document.querySelectorAll(`.miniopt[data-i="${i}"]`).forEach(x=>x.classList.remove('ok','no'));b.classList.add(o===s[8]?'ok':'no');$('mf'+i).textContent=o===s[8]?'✓ Benar!':'Belum tepat. Lihat kotak Ingat.'});$('toPractice').onclick=()=>activate('practice')}
function renderPractice(){const right=pa.filter((a,i)=>a===current.p[i][2]).length;$('practice').innerHTML=`<div class="card"><h2>Latihan bertahap</h2><div class="small" style="margin-bottom:12px">${right} dari ${current.p.length} benar</div><div class="practices">${current.p.map((p,i)=>{const st=pa[i]==null?'':pa[i]===p[2]?'ok':'no';return `<div class="practice ${st}"><div class="small">Latihan ${i+1} • ${p[3]}</div><div class="q">${p[0]}</div><div class="choices">${p[1].map((o,j)=>`<label class="choice ${pa[i]===j?'sel':''}"><input type="radio" name="p${i}" value="${j}" ${pa[i]===j?'checked':''}>${o}</label>`).join('')}</div>${pa[i]!=null?`<div class="small" style="margin-top:8px">${pa[i]===p[2]?'✓ Benar':'Belum tepat, coba ulangi rangkumannya.'}</div>`:''}</div>`}).join('')}</div><button id="toQuiz" class="btn dark" style="margin-top:14px">Lanjut ke Tes →</button></div>`;current.p.forEach((p,i)=>document.querySelectorAll(`input[name="p${i}"]`).forEach(r=>r.onchange=()=>{pa[i]=+r.value;renderPractice()}));setTimeout(()=>$('toQuiz').onclick=()=>activate('quiz'))}
function renderQuiz(){const q=current.q[qi];$('quiz').innerHTML=`<div class="progress"><div class="bar" style="width:${(qi+1)/current.q.length*100}%"></div></div><div class="card" style="margin-top:12px"><div class="small">Soal ${qi+1} dari ${current.q.length} • ${q[3]}</div><div class="q">${q[0]}</div><div class="choices">${q[1].map((o,j)=>`<label class="choice ${qa[qi]===j?'sel':''}"><input type="radio" name="qa" value="${j}" ${qa[qi]===j?'checked':''}>${o}</label>`).join('')}</div><div class="actions"><button id="prev" class="btn outline" ${qi===0?'disabled':''}>← Sebelumnya</button><button id="next" class="btn dark">${qi===current.q.length-1?'Lihat Hasil →':'Berikutnya →'}</button></div></div>`;document.querySelectorAll('input[name="qa"]').forEach(r=>r.onchange=()=>{qa[qi]=+r.value;renderQuiz()});$('prev').onclick=()=>{if(qi>0){qi--;renderQuiz()}};$('next').onclick=()=>{if(qi<current.q.length-1){qi++;renderQuiz()}else{renderResult();activate('result')}}}
function renderResultPlaceholder(){$('result').innerHTML=`<div class="card"><h2>Hasil akan muncul setelah tes</h2><p class="muted">Selesaikan tes untuk melihat hasil per kompetensi.</p><button id="startQuiz" class="btn dark">Mulai Tes</button></div>`;setTimeout(()=>$('startQuiz').onclick=()=>activate('quiz'))}
function renderResult(){let cor=0,stats={};current.q.forEach((q,i)=>{stats[q[3]]??={c:0,t:0};stats[q[3]].t++;if(qa[i]===q[2]){cor++;stats[q[3]].c++}});const score=Math.round(cor/current.q.length*100),vals=Object.entries(stats).map(([k,v])=>[k,Math.round(v.c/v.t*100)]),weak=[...vals].sort((a,b)=>a[1]-b[1])[0];$('result').innerHTML=`<div class="result"><div class="scorebox"><div class="small" style="color:#cbd5e1">Penguasaan bab</div><div class="score">${score}%</div><b>${score>=75?'Sudah cukup kuat':'Masih perlu penguatan'}</b></div><div class="card"><h2>Hasil per kompetensi</h2>${vals.map(v=>`<div class="meter"><div style="display:flex;justify-content:space-between"><span>${v[0]}</span><b>${v[1]}%</b></div><div class="track"><div class="fill" style="width:${v[1]}%"></div></div></div>`).join('')}<div class="info"><b>Prioritas berikutnya:</b> ${weak[0]}. Kembali ke rangkuman dan latihan bagian ini.</div></div></div>`}
function activate(id){['learn','practice','quiz','result'].forEach(x=>$(x).classList.toggle('active',x===id));document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.tab===id))}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>activate(t.dataset.tab));$('back').onclick=()=>show('home');renderCatalog();
</script></body></html>
