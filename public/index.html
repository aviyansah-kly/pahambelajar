<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5965d8">
<title>PahamBelajar — Belajar per Bab</title>
<style>
*{box-sizing:border-box}:root{--bg:#f6f7fb;--card:#fff;--ink:#1d2433;--muted:#667085;--line:#e5e7eb;--primary:#5965d8;--navy:#172033}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}.top{position:sticky;top:0;z-index:50;background:#fffffff2;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.topin{max-width:1080px;margin:auto;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:900;font-size:18px}.brand span{color:var(--primary)}.small{font-size:13px;color:var(--muted)}.app{max-width:1080px;margin:auto;padding:0 16px 56px}.hero{margin:24px 0 20px;border-radius:28px;padding:28px;background:linear-gradient(135deg,#5360d9,#7c3aed);color:#fff}.hero .eyebrow{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;opacity:.86}.hero h1{font-size:clamp(30px,5vw,46px);line-height:1.08;margin:8px 0 10px;max-width:780px}.hero p{margin:0;max-width:720px;line-height:1.6;color:#ede9fe}.fallback{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:14px}.fallback h2{margin:0 0 6px}.fallback p{margin:0;color:var(--muted);line-height:1.55}.status{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:14px 0;color:var(--muted)}.dot{width:10px;height:10px;border-radius:50%;background:var(--primary);animation:pulse 1s infinite alternate}.status.error{color:#991b1b;background:#fff7f7;border-color:#fecaca}.status.ready{display:none}@keyframes pulse{to{opacity:.25}}#catalog{display:none}@media(max-width:700px){.hero{padding:22px 20px;margin-top:16px;border-radius:22px}.app{padding-left:14px;padding-right:14px}}
</style>
</head>
<body>
<header class="top"><div class="topin"><div class="brand">Paham<span>Belajar</span></div><div class="small">Belajar per bab</div></div></header>
<main class="app">
<section id="home">
  <div class="hero"><div class="eyebrow">Belajar lebih terarah</div><h1>Pahami materinya, latihan, lalu cek hasilnya.</h1><p>Materi disusun per kelas, mata pelajaran, dan bab agar anak bisa belajar sedikit demi sedikit.</p></div>
  <div id="appStatus" class="status"><span class="dot"></span><span>Menyiapkan materi belajar…</span></div>
  <div id="catalog"></div>
  <noscript><div class="fallback"><h2>JavaScript diperlukan</h2><p>Aktifkan JavaScript agar PahamBelajar dapat menampilkan materi dan latihan interaktif.</p></div></noscript>
</section>
</main>
<script>
(function(){
  const status=document.getElementById('appStatus');
  const files=['/pahambelajar-enhancements.js','/child-ux.js','/math-engine.js','/remedial-feedback.js'];
  function loadScript(src,timeout=6000){
    return new Promise((resolve,reject)=>{
      const s=document.createElement('script');
      let done=false;
      const finish=(ok,err)=>{if(done)return;done=true;clearTimeout(timer);ok?resolve():reject(err||new Error('Gagal memuat '+src))};
      const timer=setTimeout(()=>finish(false,new Error('Timeout '+src)),timeout);
      s.src=src;s.async=true;
      s.onload=()=>finish(true);
      s.onerror=()=>finish(false,new Error('Gagal memuat '+src));
      document.head.appendChild(s);
    });
  }
  async function boot(){
    try{
      await loadScript(files[0],8000);
      status.classList.add('ready');
      for(const src of files.slice(1)){
        try{await loadScript(src,5000)}catch(e){console.warn(e.message)}
      }
    }catch(e){
      console.error(e);
      status.className='status error';
      status.innerHTML='<strong>Aplikasi belum berhasil dimuat.</strong><span>Coba refresh. Jika tetap sama, materi inti gagal dimuat.</span>';
    }
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
})();
</script>
</body>
</html>
