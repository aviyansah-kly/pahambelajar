<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5965d8">
<title>PahamBelajar — Belajar per Bab</title>
<style>
*{box-sizing:border-box}:root{--bg:#f6f7fb;--card:#fff;--ink:#1d2433;--muted:#667085;--line:#e5e7eb;--primary:#5965d8;--navy:#172033}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}.top{position:sticky;top:0;z-index:50;background:#fffffff2;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.topin{max-width:1080px;margin:auto;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:900;font-size:18px}.brand span{color:var(--primary)}.small{font-size:13px;color:var(--muted)}.app{max-width:1080px;margin:auto;padding:0 16px 56px}.hero{margin:24px 0 20px;border-radius:28px;padding:28px;background:linear-gradient(135deg,#5360d9,#7c3aed);color:#fff}.hero .eyebrow{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;opacity:.86}.hero h1{font-size:clamp(30px,5vw,46px);line-height:1.08;margin:8px 0 10px;max-width:780px}.hero p{margin:0;max-width:720px;line-height:1.6;color:#ede9fe}.fallback{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:14px}.fallback h2{margin:0 0 6px}.fallback p{margin:0;color:var(--muted);line-height:1.55}#catalog{display:none}@media(max-width:700px){.hero{padding:22px 20px;margin-top:16px;border-radius:22px}.app{padding-left:14px;padding-right:14px}}
</style>
</head>
<body>
<header class="top"><div class="topin"><div class="brand">Paham<span>Belajar</span></div><div class="small">Belajar per bab</div></div></header>
<main class="app">
<section id="home">
  <div class="hero"><div class="eyebrow">Belajar lebih terarah</div><h1>Pahami materinya, latihan, lalu cek hasilnya.</h1><p>Materi disusun per kelas, mata pelajaran, dan bab agar anak bisa belajar sedikit demi sedikit.</p></div>
  <div id="catalog"></div>
  <noscript><div class="fallback"><h2>JavaScript diperlukan</h2><p>Aktifkan JavaScript agar PahamBelajar dapat menampilkan materi dan latihan interaktif.</p></div></noscript>
</section>
</main>
<script src="/pahambelajar-enhancements.js"></script>
<script src="/child-ux.js"></script>
<script src="/math-engine.js"></script>
<script src="/remedial-feedback.js"></script>
</body>
</html>
